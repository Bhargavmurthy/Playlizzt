<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayLizzt</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Georgia, 'Times New Roman', Times, serif;
  }

  img.bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    color: white;
    padding: 20px;
  }

  h1 {
    font-weight: 100;
    font-size: 100px;
    margin: 0;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  h3 {
    font-weight: 100;
    margin-top: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

  <img class="bg" src="./nyc.jpg" alt="focus background">

  <div class="overlay">
    <h1>Time to focus</h1>
    <h3>Come on! Stop scrolling! Get to work!</h3>
  </div>

  <div id="startOverlay">Click anywhere to start</div>

  <audio id="bgm" src="./pianoMusique.mp3" controls loop preload="auto"></audio>


</body>
</html>
